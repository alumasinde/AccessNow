openapi: 3.0.3
info:
  title: AccessNow API
  version: 1.0.0
  description: The versioned HTTP contract for the AccessNow access-control API. Routes are mounted from internal/server/router.go
    and each module's Register function. Browser clients authenticate with the accessnow_session cookie or an Authorization
    bearer token; machine integrations use X-API-Key; gate devices also require X-Device-Token.
servers:
- url: /
  description: Same-origin deployment.
tags:
- name: auth
  description: Login, logout and the current session.
- name: gates
  description: Gate picker and shift selection.
- name: passes
  description: Core pass register and number formats.
- name: movements
  description: Gate scan, on-site roster and offline movement upload.
- name: visitor
  description: Visitor pre-registration, approval and desk check-in/out.
- name: vehicle
  description: Vehicle journeys and the vehicle register.
- name: material
  description: Inward/outward goods declarations and returns.
- name: staff
  description: Employee step-out passes and reasons.
- name: contractor
  description: Contractor firms, people, documents and passes.
- name: scanning
  description: Pass tokens and scan attempts.
- name: approval
  description: Approval chains, flows and delegations.
- name: rules
  description: Scan and request rules, evaluations and the rule catalogue.
- name: blocklist
  description: Blocklist/watchlist entries and their hits.
- name: notifications
  description: Inbox, routing, templates, outbox and delivery.
- name: offline
  description: Device cache, sync batches and conflicts.
- name: rollcall
  description: Emergency roll-call incidents and roster marking.
- name: reports
  description: Report definitions, runs and schedules.
- name: compliance
  description: Retention policies, legal holds, audit verification and purges.
- name: integrations
  description: API keys, webhooks, actuators, external systems and machine reads.
- name: gate
  description: Routes mounted on the gate-device surface; these also require X-Device-Token.
- name: system
  description: Operational health endpoints.
security:
- sessionCookie: []
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login Â· auth
      operationId: auth_Login
      x-handler: Login
      security: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Invalid request or validation failure.
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: No valid session, bearer token, API key or device token.
          content: *id001
        '403':
          description: Authenticated but not permitted, or gate is unassigned.
          content: *id001
        '404':
          description: Not found, or the module is disabled for this tenant.
          content: *id001
        '409':
          description: The request conflicts with current state.
          content: *id001
        '500':
          description: Internal server error.
          content: *id001
        '429':
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
