components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: accessnow_session
      description: Session cookie set by POST /api/v1/auth/login.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token returned once by POST /api/v1/auth/login.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Machine integration key issued from /api/v1/integrations/api-keys.
    deviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Enrolled gate-device token. Required in addition to a session or bearer token on /api/v1/gate/*.
  schemas:
    ApprovalAskView:
      properties:
        acted_at:
          format: date-time
          nullable: true
          type: string
        approver_role_key:
          nullable: true
          type: string
        assigned_at:
          format: date-time
          type: string
        assignee:
          type: string
        assignee_user_id:
          format: int64
          nullable: true
          type: integer
        can_answer:
          type: boolean
        comment:
          nullable: true
          type: string
        delegated_from_user_id:
          format: int64
          nullable: true
          type: integer
        due_at:
          format: date-time
          nullable: true
          type: string
        escalated_from_step_no:
          nullable: true
          type: integer
        id:
          format: int64
          type: integer
        is_overdue:
          type: boolean
        is_waiting:
          type: boolean
        mode:
          type: string
        name:
          type: string
        status:
          type: string
        step_no:
          type: integer
      required:
      - id
      - step_no
      - name
      - mode
      - assignee
      - status
      - assigned_at
      - is_waiting
      - is_overdue
      - can_answer
      type: object
    ApprovalChainSummary:
      properties:
        approval_flow_id:
          format: int64
          nullable: true
          type: integer
        completed_at:
          format: date-time
          nullable: true
          type: string
        currency:
          nullable: true
          type: string
        current_step_no:
          type: integer
        deadline_at:
          format: date-time
          nullable: true
          type: string
        decided_by_user_id:
          format: int64
          nullable: true
          type: integer
        decision_note:
          nullable: true
          type: string
        escalation_count:
          type: integer
        id:
          format: int64
          type: integer
        is_open:
          type: boolean
        pass_id:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        status:
          type: string
        total_steps:
          type: integer
        value_amount:
          format: double
          nullable: true
          type: number
      required:
      - id
      - pass_id
      - status
      - current_step_no
      - total_steps
      - escalation_count
      - started_at
      - is_open
